name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Pre-configure Flutter
        run: |
          flutter config --no-analytics
          flutter doctor

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          pip install flet
          # Installiamo le librerie. Se hai rinominato il file in requirements.txt bene, 
          # altrimenti le installiamo manualmente per sicurezza:
          pip install google-generativeai fpdf2 python-dotenv opencv-python-headless

      - name: Build APK (Forced Yes)
        run: |
          # Usiamo printf per inviare 'y' e 'invio' in modo più robusto
          printf 'y\n' | flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSSA-App-Installabile
          path: build/apk/*.apk
