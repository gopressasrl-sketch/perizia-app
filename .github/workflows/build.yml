name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          pip install flet

      - name: Install Dependencies
        run: |
          pip install google-generativeai fpdf2 python-dotenv opencv-python-headless
        
      - name: Build APK
        run: |
          # Il comando 'yes |' risponde automaticamente 'y' a tutte le domande
          yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSSA-App-Installabile
          path: build/apk/*.apk
