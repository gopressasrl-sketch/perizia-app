name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: pip install flet httpx

      - name: Build APK
        run: |
          # Usiamo il comando base, senza permessi che lo rompono
          printf '\n' | flet build apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gssa-app
          path: build/apk/*.apk
