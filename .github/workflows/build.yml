name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses (Forced)
        run: |
          # Questo è il comando specifico che sblocca tutto
          yes | flutter doctor --android-licenses

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          pip install flet google-generativeai fpdf2 python-dotenv opencv-python-headless

      - name: Build APK
        run: |
          # Ora Flet troverà le licenze già accettate
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSSA-App-Installabile
          path: build/apk/*.apk
