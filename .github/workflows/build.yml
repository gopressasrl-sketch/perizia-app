name: Build APK Professional
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: pip install flet httpx

      - name: Build APK Multi-Arch
        run: |
          # Questo comando crea un APK compatibile con quasi tutti i telefoni
          flet build apk --arch arm64-v8a,armeabi-v7a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSSA-PRO-UNIVERSALE
          path: build/apk/*.apk
